<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#556677"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2733">SOC Lab — Network Topology</text>

  <!-- Internet cloud -->
  <ellipse cx="500" cy="70" rx="70" ry="28" fill="#e8eef3" stroke="#8fa3b3" stroke-width="1.5"/>
  <text x="500" y="75" text-anchor="middle" font-size="13" fill="#3a4a58">Internet</text>
  <line x1="500" y1="98" x2="500" y2="150" stroke="#556677" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="125" font-size="11" fill="#556677">WAN (em0, NAT)</text>

  <!-- pfSense box -->
  <rect x="380" y="150" width="240" height="80" rx="8" fill="#1f3a52" />
  <text x="500" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">pfSense-Gateway</text>
  <text x="500" y="200" text-anchor="middle" font-size="11" fill="#c9d6e0">Firewall / Router</text>
  <text x="500" y="216" text-anchor="middle" font-size="10" fill="#9fb2c2">Default-deny policy per zone</text>

  <!-- Host-only access -->
  <line x1="380" y1="200" x2="230" y2="200" stroke="#556677" stroke-width="2"/>
  <rect x="80" y="175" width="150" height="50" rx="6" fill="#eef2f5" stroke="#8fa3b3"/>
  <text x="155" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1a2733">Host Laptop</text>
  <text x="155" y="211" text-anchor="middle" font-size="10" fill="#556677">192.168.56.1 (GUI access)</text>

  <!-- WireGuard -->
  <line x1="620" y1="200" x2="770" y2="200" stroke="#556677" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="770" y="175" width="150" height="50" rx="6" fill="#eef2f5" stroke="#8fa3b3"/>
  <text x="845" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2733">WireGuard VPN</text>
  <text x="845" y="207" text-anchor="middle" font-size="10" fill="#556677">10.10.99.0/24 (remote admin)</text>
  <text x="845" y="219" text-anchor="middle" font-size="9" fill="#8899a8">UDP 51820</text>

  <!-- Zone boxes -->
  <!-- Management -->
  <rect x="60" y="300" width="170" height="90" rx="8" fill="#eef6ee" stroke="#6fa87a" stroke-width="1.5"/>
  <text x="145" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#2b5c36">Management</text>
  <text x="145" y="342" text-anchor="middle" font-size="10" fill="#3a6b46">LAN (em1, native)</text>
  <text x="145" y="357" text-anchor="middle" font-size="10" fill="#3a6b46">10.10.10.0/24</text>
  <text x="145" y="373" text-anchor="middle" font-size="9" fill="#5a8a66">untagged</text>

  <!-- Victims -->
  <rect x="270" y="300" width="170" height="90" rx="8" fill="#eaf1fb" stroke="#5c86b8" stroke-width="1.5"/>
  <text x="355" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4a75">Victims</text>
  <text x="355" y="342" text-anchor="middle" font-size="10" fill="#2c5c8c">em1.20 (VLAN 20)</text>
  <text x="355" y="357" text-anchor="middle" font-size="10" fill="#2c5c8c">10.10.20.0/24</text>
  <text x="355" y="373" text-anchor="middle" font-size="9" fill="#4b76a6">Ubuntu-Victim .10</text>

  <!-- Attacker -->
  <rect x="480" y="300" width="170" height="90" rx="8" fill="#fbeaea" stroke="#c05c5c" stroke-width="1.5"/>
  <text x="565" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#7a2323">Attacker</text>
  <text x="565" y="342" text-anchor="middle" font-size="10" fill="#8c3535">em1.30 (VLAN 30)</text>
  <text x="565" y="357" text-anchor="middle" font-size="10" fill="#8c3535">10.10.30.0/24</text>
  <text x="565" y="373" text-anchor="middle" font-size="9" fill="#a65858">Kali-Attacker .10</text>

  <!-- Legacy -->
  <rect x="690" y="300" width="150" height="90" rx="8" fill="#faf3e3" stroke="#c99a3d" stroke-width="1.5"/>
  <text x="765" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5a12">Legacy</text>
  <text x="765" y="342" text-anchor="middle" font-size="10" fill="#8c6b1f">em3 (dedicated NIC)</text>
  <text x="765" y="357" text-anchor="middle" font-size="10" fill="#8c6b1f">10.10.40.0/24</text>
  <text x="765" y="373" text-anchor="middle" font-size="9" fill="#a6832f">Metasploitable2 .10</text>

  <!-- Windows -->
  <rect x="860" y="300" width="130" height="90" rx="8" fill="#f2eafb" stroke="#8a5cc0" stroke-width="1.5"/>
  <text x="925" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#4a237a">Windows</text>
  <text x="925" y="342" text-anchor="middle" font-size="10" fill="#5c358c">em4 (dedicated NIC)</text>
  <text x="925" y="357" text-anchor="middle" font-size="10" fill="#5c358c">10.10.50.0/24</text>
  <text x="925" y="373" text-anchor="middle" font-size="9" fill="#7658a6">Win11-Victim .100</text>

  <!-- Connectors from pfSense to zones -->
  <line x1="440" y1="230" x2="145" y2="300" stroke="#6fa87a" stroke-width="1.5"/>
  <line x1="470" y1="230" x2="355" y2="300" stroke="#5c86b8" stroke-width="1.5"/>
  <line x1="530" y1="230" x2="565" y2="300" stroke="#c05c5c" stroke-width="1.5"/>
  <line x1="560" y1="230" x2="765" y2="300" stroke="#c99a3d" stroke-width="1.5"/>
  <line x1="600" y1="230" x2="925" y2="300" stroke="#8a5cc0" stroke-width="1.5"/>

  <!-- Trunk label -->
  <rect x="270" y="270" width="380" height="18" rx="3" fill="#dbe7d0" opacity="0.0"/>
  <text x="460" y="280" text-anchor="middle" font-size="10" fill="#7a8a95" font-style="italic">soclab-net trunk carries VLAN 20 + VLAN 30 (tagged); Legacy &amp; Windows use dedicated NICs (untagged)</text>

  <!-- Policy arrows -->
  <line x1="565" y1="390" x2="565" y2="440" stroke="#c05c5c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 540 440 L 400 440 L 400 390" stroke="#c05c5c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="480" y="460" text-anchor="middle" font-size="10" fill="#7a2323">Attacker → Victims / Legacy / Windows: ALLOWED</text>

  <line x1="355" y1="390" x2="355" y2="500" stroke="#9aa5ad" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="565" y1="500" x2="355" y2="500" stroke="#9aa5ad" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="565" y1="500" x2="565" y2="390" stroke="#9aa5ad" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="460" y="515" text-anchor="middle" font-size="10" fill="#66707a">Victims → Attacker: DENIED (default-deny, no explicit rule)</text>

  <!-- Legend -->
  <rect x="60" y="550" width="880" height="50" rx="6" fill="#f7f8f9" stroke="#dfe4e8"/>
  <text x="80" y="570" font-size="10" fill="#3a4a58" font-weight="600">Legend:</text>
  <text x="80" y="587" font-size="9.5" fill="#556677">Solid line = firewall-permitted path · Dashed grey = denied by default-deny · All inter-zone traffic passes through pfSense (verified via TTL decrement in testing)</text>
</svg>
